hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath:
  - file://verl/trainer/config
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - algorithm.adv_estimator=grpo
    - data.train_files=/workspace/SearchShortQA/data/rl_train_data.parquet
    - data.val_files=/workspace/SearchShortQA/data/rl_train_data.parquet
    - data.train_batch_size=32
    - data.max_prompt_length=2048
    - data.max_response_length=4096
    - data.prompt_key=prompt
    - data.filter_overlong_prompts=True
    - data.truncation=right
    - data.return_raw_chat=True
    - actor_rollout_ref.model.path=/workspace/Qwen/Qwen3-4B
    - actor_rollout_ref.actor.optim.lr=1e-6
    - actor_rollout_ref.actor.optim.warmup_style=cosine
    - actor_rollout_ref.actor.optim.lr_warmup_steps_ratio=0.1
    - actor_rollout_ref.model.use_remove_padding=True
    - actor_rollout_ref.actor.ppo_mini_batch_size=16
    - actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu=1
    - actor_rollout_ref.actor.use_kl_loss=True
    - actor_rollout_ref.actor.kl_loss_coef=0.001
    - actor_rollout_ref.actor.kl_loss_type=low_var_kl
    - actor_rollout_ref.actor.entropy_coeff=0
    - actor_rollout_ref.model.enable_gradient_checkpointing=True
    - actor_rollout_ref.actor.fsdp_config.param_offload=False
    - actor_rollout_ref.actor.fsdp_config.optimizer_offload=False
    - global_profiler.tool=torch_memory
    - global_profiler.save_path=./mem_snapshots
    - global_profiler.global_tool_config.torch_memory.trace_alloc_max_entries=100000
    - global_profiler.global_tool_config.torch_memory.stack_depth=32
    - actor_rollout_ref.rollout.log_prob_micro_batch_size_per_gpu=1
    - actor_rollout_ref.rollout.tensor_model_parallel_size=2
    - actor_rollout_ref.rollout.name=sglang
    - actor_rollout_ref.rollout.mode=async
    - actor_rollout_ref.rollout.multi_turn.enable=True
    - actor_rollout_ref.rollout.multi_turn.max_assistant_turns=6
    - actor_rollout_ref.rollout.multi_turn.max_user_turns=5
    - actor_rollout_ref.rollout.multi_turn.format=custom
    - actor_rollout_ref.rollout.multi_turn.max_tool_response_length=1024
    - actor_rollout_ref.rollout.response_length=4096
    - actor_rollout_ref.rollout.gpu_memory_utilization=0.60
    - actor_rollout_ref.rollout.enable_chunked_prefill=True
    - actor_rollout_ref.rollout.multi_stage_wake_up=True
    - actor_rollout_ref.rollout.n=4
    - actor_rollout_ref.ref.log_prob_micro_batch_size_per_gpu=1
    - actor_rollout_ref.ref.fsdp_config.param_offload=True
    - actor_rollout_ref.rollout.over_sample_rate=0.1
    - actor_rollout_ref.rollout.skip_tokenizer_init=False
    - reward_model.enable=False
    - reward_model.reward_manager=custom
    - algorithm.use_kl_in_reward=False
    - trainer.critic_warmup=0
    - trainer.logger=["console", "swanlab", "tensorboard"]
    - trainer.project_name=SearchShortQA-GRPO
    - trainer.experiment_name=qwen3-4b_rl_2026-04-26_04:13:27
    - trainer.n_gpus_per_node=2
    - trainer.nnodes=1
    - trainer.default_local_dir=/workspace/output/SearchShortQA-RL
    - trainer.save_freq=5
    - trainer.test_freq=-1
    - trainer.val_before_train=False
    - trainer.resume_mode=disable
    - actor_rollout_ref.rollout.multi_turn.tool_config_path=/workspace/SearchShortQA/verl/examples/sglang_multiturn/config/tool_config/custom_tool_config.yaml
    - trainer.total_epochs=2
    - actor_rollout_ref.rollout.update_weights_bucket_megabytes=512
  job:
    name: main_ppo
    chdir: null
    override_dirname: actor_rollout_ref.actor.entropy_coeff=0,actor_rollout_ref.actor.fsdp_config.optimizer_offload=False,actor_rollout_ref.actor.fsdp_config.param_offload=False,actor_rollout_ref.actor.kl_loss_coef=0.001,actor_rollout_ref.actor.kl_loss_type=low_var_kl,actor_rollout_ref.actor.optim.lr=1e-6,actor_rollout_ref.actor.optim.lr_warmup_steps_ratio=0.1,actor_rollout_ref.actor.optim.warmup_style=cosine,actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu=1,actor_rollout_ref.actor.ppo_mini_batch_size=16,actor_rollout_ref.actor.use_kl_loss=True,actor_rollout_ref.model.enable_gradient_checkpointing=True,actor_rollout_ref.model.path=/workspace/Qwen/Qwen3-4B,actor_rollout_ref.model.use_remove_padding=True,actor_rollout_ref.ref.fsdp_config.param_offload=True,actor_rollout_ref.ref.log_prob_micro_batch_size_per_gpu=1,actor_rollout_ref.rollout.enable_chunked_prefill=True,actor_rollout_ref.rollout.gpu_memory_utilization=0.60,actor_rollout_ref.rollout.log_prob_micro_batch_size_per_gpu=1,actor_rollout_ref.rollout.mode=async,actor_rollout_ref.rollout.multi_stage_wake_up=True,actor_rollout_ref.rollout.multi_turn.enable=True,actor_rollout_ref.rollout.multi_turn.format=custom,actor_rollout_ref.rollout.multi_turn.max_assistant_turns=6,actor_rollout_ref.rollout.multi_turn.max_tool_response_length=1024,actor_rollout_ref.rollout.multi_turn.max_user_turns=5,actor_rollout_ref.rollout.multi_turn.tool_config_path=/workspace/SearchShortQA/verl/examples/sglang_multiturn/config/tool_config/custom_tool_config.yaml,actor_rollout_ref.rollout.n=4,actor_rollout_ref.rollout.name=sglang,actor_rollout_ref.rollout.over_sample_rate=0.1,actor_rollout_ref.rollout.response_length=4096,actor_rollout_ref.rollout.skip_tokenizer_init=False,actor_rollout_ref.rollout.tensor_model_parallel_size=2,actor_rollout_ref.rollout.update_weights_bucket_megabytes=512,algorithm.adv_estimator=grpo,algorithm.use_kl_in_reward=False,data.filter_overlong_prompts=True,data.max_prompt_length=2048,data.max_response_length=4096,data.prompt_key=prompt,data.return_raw_chat=True,data.train_batch_size=32,data.train_files=/workspace/SearchShortQA/data/rl_train_data.parquet,data.truncation=right,data.val_files=/workspace/SearchShortQA/data/rl_train_data.parquet,global_profiler.global_tool_config.torch_memory.stack_depth=32,global_profiler.global_tool_config.torch_memory.trace_alloc_max_entries=100000,global_profiler.save_path=./mem_snapshots,global_profiler.tool=torch_memory,reward_model.enable=False,reward_model.reward_manager=custom,trainer.critic_warmup=0,trainer.default_local_dir=/workspace/output/SearchShortQA-RL,trainer.experiment_name=qwen3-4b_rl_2026-04-26_04:13:27,trainer.logger=["console",
      "swanlab", "tensorboard"],trainer.n_gpus_per_node=2,trainer.nnodes=1,trainer.project_name=SearchShortQA-GRPO,trainer.resume_mode=disable,trainer.save_freq=5,trainer.test_freq=-1,trainer.total_epochs=2,trainer.val_before_train=False
    id: ???
    num: ???
    config_name: search_grpo
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /workspace/SearchShortQA/verl
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /workspace/SearchShortQA/verl/examples/sglang_multiturn/config
      schema: file
      provider: main
    - path: verl/trainer/config
      schema: file
      provider: hydra.searchpath in main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /workspace/SearchShortQA/verl/outputs/2026-04-26/04-13-42
    choices:
      reward_model: dp_reward_model
      critic: dp_critic
      critic/../engine@critic.model.fsdp_config: fsdp
      critic/../optim@critic.optim: fsdp
      model@actor_rollout_ref.model: hf_model
      rollout@actor_rollout_ref.rollout: rollout
      ref@actor_rollout_ref.ref: dp_ref
      ref/../engine@actor_rollout_ref.ref.fsdp_config: fsdp
      data: legacy_data
      actor@actor_rollout_ref.actor: dp_actor
      actor/../engine@actor_rollout_ref.actor.fsdp_config: fsdp
      actor/../optim@actor_rollout_ref.actor.optim: fsdp
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
